<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .background { fill: #0066CC; }
      .foreground { fill: white; }
    }
    @media (prefers-color-scheme: dark) {
      .background { fill: #003366; }
      .foreground { fill: white; }
    }
  </style>
  <defs>
    <clipPath id="clip0">
      <rect width="180" height="180" rx="37" fill="white"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip0)">
    <!-- New favicon design with financial platform theme -->
    <rect class="background" width="180" height="180" rx="37"/>
    
    <!-- Document icon representing financial records -->
    <rect class="foreground" x="45" y="40" width="70" height="90" rx="4"/>
    <rect class="background" x="52" y="55" width="56" height="6" rx="2"/>
    <rect class="background" x="52" y="68" width="42" height="6" rx="2"/>
    <rect class="background" x="52" y="81" width="56" height="6" rx="2"/>
    <rect class="background" x="52" y="94" width="35" height="6" rx="2"/>
    <rect class="background" x="52" y="107" width="48" height="6" rx="2"/>
    
    <!-- Graph/chart icon representing distribution and analytics -->
    <path class="foreground" d="M120 130 L120 80 L130 95 L140 70 L150 85 L150 130 Z" opacity="0.9"/>
    <circle class="foreground" cx="120" cy="80" r="4"/>
    <circle class="foreground" cx="130" cy="95" r="4"/>
    <circle class="foreground" cx="140" cy="70" r="4"/>
    <circle class="foreground" cx="150" cy="85" r="4"/>
    
    <!-- Connection lines representing system integration -->
    <path class="foreground" d="M115 65 Q105 55 90 60" stroke-width="2.5" fill="none" stroke="white" opacity="0.7"/>
    <circle class="foreground" cx="90" cy="60" r="3"/>
  </g>
</svg>
